                id: 10,
                topic: "6. CSS Box Model",
                question: "Элементтің көршілес басқа элементтерден СЫРТҚЫ арақашықтығы:",
                options: ["Padding", "Margin", "Border", "Gap"],
                correct: 1,
                explain: "Margin — бұл сыртқы бос шегініс."
            },
            {
                id: 11,
                topic: "8. Псевдокластар",
                question: "Тінтуір (мышь) меңзерін элемент үстіне апарғанда қолданылатын псевдокласс:",
                options: [":active", ":focus", ":hover", ":visited"],
                correct: 2,
                explain: ":hover меңзер элемент үстіне келген күйді сипаттайды."
            },
            {
                id: 12,
                topic: "7. Түстер мен Фондар",
                question: "HEX форматындағы түстер қай символдан басталады?",
                options: ["$", "#", "&", "rgb"],
                correct: 1,
                explain: "HEX кодтары әрдайым решітка (#) таңбасынан басталады (мысалы: #ffffff)."
            },
            {
                id: 13,
                topic: "4. Кестелермен Жұмыс",
                question: "Кестенің жолдарын біріктіру үшін қай атрибут керек?",
                options: ["colspan", "rowspan", "rowmerge", "grid-row"],
                correct: 1,
                explain: "rowspan екі немесе одан да көп қатарды/жолды вертикалды түрде біріктіреді."
            },
            {
                id: 14,
                topic: "10. Атрибуттар",
                question: "Енгізу өрісіне (input) подсказка мәтін жазуға арналған атрибут:",
                options: ["value", "name", "placeholder", "text"],
                correct: 2,
                explain: "placeholder өріс бос болғанда көрініп туратын сұр мәтінді анықтайды."
            },
            {
                id: 15,
                topic: "9. CSS Каскадтылық",
                question: "Cascading ұғымының негізгі мағынасы:",
                options: [
                    "Стильдердің жоғарыдан төмен басымдық бойынша қолданылуы",
                    "Кодты сығу алгоритмі",
                    "Файлдарды жүктеу",
                    "Деректерді кодтау"
                ],
                correct: 0,
                explain: "Каскадтылық — қай стильдің басымдыққа ие болатынын реттейді."
            }
        ];

        // State variables
        let currentModuleIndex = 0;
        let currentQuizIndex = 0;
        let quizScore = 0;
        let selectedOption = null;

        // On Load Initializer
        window.onload = function() {
            renderModulesNav();
            loadModule(0);
            initTheme();
        };

        function initTheme() {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function renderModulesNav() {
            const nav = document.getElementById('moduleList');
            nav.innerHTML = modulesData.map((mod, idx) => `
                <button onclick="loadModule(${idx})" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-between ${idx === currentModuleIndex ? 'bg-blue-50 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'}">
                    <span class="truncate">${mod.title}</span>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
                </button>
            `).join('');
        }

        function loadModule(index) {
            currentModuleIndex = index;
            renderModulesNav();
            const mod = modulesData[index];
            const viewer = document.getElementById('contentViewer');
            
            viewer.innerHTML = `
                <div class="space-y-4">
                    <div class="inline-block px-3 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 rounded-full text-xs font-semibold uppercase tracking-wider">
                        Модуль ${mod.id} / ${modulesData.length}
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">${mod.title}</h1>
                    <p class="text-gray-500 dark:text-gray-400 text-sm border-b border-gray-100 dark:border-gray-700 pb-4">${mod.description}</p>
                    <div class="prose dark:prose-invert max-w-none pt-2">
                        ${mod.content}
                    </div>
                </div>
            `;

            if(mod.sampleCode) {
                document.getElementById('codeEditor').value = mod.sampleCode;
                runCode();
            }
        }

        // Live Editor Runner
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const preview = document.getElementById('codePreview');
            const previewDoc = preview.contentDocument || preview.contentWindow.document;
            previewDoc.open();
            previewDoc.write(code);
            previewDoc.close();
        }

        function resetEditorCode() {
            document.getElementById('codeEditor').value = '';
            runCode();
        }

        // СУРЕТ ТҮРІНДЕ ШЫҒАРУ/ЖҮКТЕУ ФУНКЦИЯСЫ (Export Preview as Image)
        function exportPreviewAsImage() {
            const previewIframe = document.getElementById('codePreview');
            const iframeBody = previewIframe.contentDocument.body;

            if (!iframeBody || iframeBody.innerHTML.trim() === "") {
                alert("Экспорттау үшін алдымен редакторға код енгізіңіз!");
                return;
            }

            // html2canvas арқылы iframe ішін суретке айналдыру
            html2canvas(iframeBody, {
                useCORS: true, // Сыртқы суреттерді де қамту үшін
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'webdev-result.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert("Суретті шығару кезінде қате орын алды: " + err);
            });
        }

        // Quiz System Functions
        function openQuiz() {
            currentQuizIndex = 0;
            quizScore = 0;
            selectedOption = null;
            document.getElementById('quizModal').classList.remove('hidden');
            renderQuizStep();
        }

        function closeQuiz() {
            document.getElementById('quizModal').classList.add('hidden');
        }

        function renderQuizStep() {
            const container = document.getElementById('quizContent');
            const footer = document.getElementById('quizFooter');
            const progress = document.getElementById('quizProgress');

            if (currentQuizIndex >= quizData.length) {
                const percentage = Math.round((quizScore / quizData.length) * 100);
                container.innerHTML = `
                    <div class="text-center py-8 space-y-4">
                        <div class="w-20 h-20 bg-amber-100 dark:bg-amber-900/40 text-amber-500 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 dark:text-white">Тест Аяқталды!</h3>
                        <p class="text-gray-500 dark:text-gray-400">Нәтижеңіз: <span class="font-bold text-blue-600 dark:text-blue-400">${quizScore} / ${quizData.length}</span> (${percentage}%)</p>
                        <div class="pt-4">
                            <button onclick="openQuiz()" class="px-6 py-2.5 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition">
                                Кайтадан тапсыру
                            </button>
                        </div>
                    </div>
                `;
                footer.classList.add('hidden');
                return;
            }

            footer.classList.remove('hidden');
            const q = quizData[currentQuizIndex];
            progress.innerText = `Сұрақ ${currentQuizIndex + 1} / ${quizData.length}`;

            container.innerHTML = `
                <div class="space-y-4">
                    <span class="text-xs font-semibold px-2.5 py-1 rounded bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                        ${q.topic}
                    </span>
                    <h4 class="text-lg font-bold text-gray-900 dark:text-white">${q.question}</h4>
                    <div class="space-y-2 pt-2">
                        ${q.options.map((opt, idx) => `
                            <button onclick="selectOption(${idx})" id="opt-${idx}" class="w-full text-left p-3.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition flex items-center justify-between text-sm">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle text-gray-400"></i>
                            </button>
                        `).join('')}
                    </div>
                    <div id="explanationBox" class="hidden p-4 rounded-xl text-sm border"></div>
                </div>
            `;

            selectedOption = null;
            document.getElementById('nextBtn').disabled = true;
        }

        function selectOption(index) {
            if (selectedOption !== null) return;
            
            selectedOption = index;
            const q = quizData[currentQuizIndex];
            const explainBox = document.getElementById('explanationBox');

            q.options.forEach((_, idx) => {
                const btn = document.getElementById(`opt-${idx}`);
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.className = "w-full text-left p-3.5 rounded-xl border border-green-500 bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 font-medium text-sm flex items-center justify-between";
                    btn.querySelector('i').className = "fa-solid fa-circle-check text-green-500";
                } else if (idx === index) {
                    btn.className = "w-full text-left p-3.5 rounded-xl border border-red-500 bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 font-medium text-sm flex items-center justify-between";
                    btn.querySelector('i').className = "fa-solid fa-circle-xmark text-red-500";
                }
            });

            if (index === q.correct) quizScore++;

            explainBox.className = "p-4 rounded-xl text-sm border bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800 text-blue-800 dark:text-blue-200";
            explainBox.innerHTML = `<strong>Түсініктеме:</strong> ${q.explain}`;
            explainBox.classList.remove('hidden');

            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            currentQuizIndex++;
            renderQuizStep();
        }
    </script>
</body>
</html>
